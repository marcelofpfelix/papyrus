[site]
title = "papyrus"
description = "Reusable Astro theme package for posts, docs, projects, profile/CV pages, search, RSS, and generated metadata."
url = "https://papyrus.marcelofelix.com"
lang = "en"
dir = "ltr"
timezone = "Europe/Lisbon"

[seo]
locale = "en_US"

[brand]
title = "papyrus"
mark = "twinkle"
show_title = true

[theme]
profile = "gruvbox"
font_profile = "readable"

[profile.images]
effect = "tritone"

[markdown]
link_style = "accent-hover-underline"
heading_style = "plain"
marker_style = "accent"
blockquote_style = "accent-bar"
table_style = "horizontal"
table_header_style = "muted"
inline_code_style = "panel"

[source]
repo = "marcelofpfelix/papyrus"

[comments]
enabled = true
repo = "marcelofpfelix/papyrus"
repo_id = "R_kgDOTU1y-A"
category_id = "DIC_kwDOTU1y-M4DDluk"

[features]
search = true
rss = true
themeControls = true
share = true
toc = true
postTags = true
aiMetadata = true
sourceActions = true
backToTop = true

[post_card]
tags = false
read_time = false
fresh_indicators = true
fresh_indicator_text = true
updated_date_only = true
limit = 20

[[nav]]
href = "/posts/"
label = "Posts"

[[nav]]
href = "/projects/"
label = "Projects"

[[nav]]
href = "/collections/"
label = "Collections"

[[nav]]
href = "/profile/"
label = "Profile"

[[nav]]
href = "/about/"
label = "About"

[[footer]]
href = "/collections/docs/"
label = "Docs"

[[social]]
href = "https://github.com/marcelofpfelix/papyrus"
label = "GitHub"
icon = "github"
